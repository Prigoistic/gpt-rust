  name: tokeniser-core-rust-check

  on:
    push:
      branches: [main]
    pull_request:

  env:
    CARGO_TERM_COLOR: always

  jobs:
    rust:
      name: Rust (fmt, clippy, test)
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: dtolnay/rust-toolchain@stable
          with:
            components: rustfmt, clippy
        - uses: Swatinem/rust-cache@v2

        - name: Format
          run: cargo fmt --all -- --check

        - name: Clippy
          run: cargo clippy -p tokeniser-core --all-targets -- -D warnings

        - name: Test
          run: cargo test -p tokeniser-core

    python-parity:
      name: Rust + Python vs tiktoken
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: dtolnay/rust-toolchain@stable
        - uses: Swatinem/rust-cache@v2
        - uses: astral-sh/setup-uv@v5

        - name: Install Python deps
          run: uv sync

        - name: Build PyO3 extension (release)
          working-directory: crates/tokeniser-py
          run: |
            source ../../.venv/bin/activate
            maturin develop --release

        - name: Verify against tiktoken
          run: uv run python tests/test_against_tiktoken.py
